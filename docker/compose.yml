services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SQLITE_URL: 'file:/data/multiuser.sqlite'
      MEMORY_ROOT: '/data/memory'
      API_PORT: '3000'
      NODE_ENV: development
      LOG_LEVEL: info
    env_file:
      - path: ../.env
        required: false
    ports:
      - '3000:3000'
    volumes:
      - app-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-data:
