services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SQLITE_URL: 'file:/data/multiuser.sqlite'
      MEMORY_ROOT: '/data/memory'
      API_PORT: '3000'
      NODE_ENV: test
      LOG_LEVEL: warn
      # NOTE: Worker features (briefing-generator, live-responder) require DEFAULT_MODEL_SPEC.
      # Hermetic API tests focus on HTTP contract (CRUD, scope isolation).
      # Worker-triggered features are tested in integration tests instead.
    ports:
      - '3000:3000'
    volumes:
      - app-api-test:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/health']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app-api-test:
